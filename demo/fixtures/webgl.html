<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>webgl renderer fixture</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #101014;
        font-family: system-ui, sans-serif;
        color: #e8e8ea;
      }
      #controls {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 999;
        display: flex;
        gap: 8px;
        padding: 12px;
        background: #1c1c22;
      }
      #controls button {
        padding: 8px 12px;
        font-size: 14px;
      }
      #status {
        position: fixed;
        top: 56px;
        left: 12px;
        z-index: 999;
        font: 12px ui-monospace, monospace;
      }
      #mount:not([data-themed]) .bs-sheet {
        background: #23232b;
        --bs-handle-color: #6d6d7a;
      }
      #mount[data-themed] {
        --bs-surface: #23232b;
        --bs-handle-color: #6d6d7a;
      }
      html.light #mount[data-themed] {
        --bs-surface: #f0f0f5;
      }
      html.light #mount:not([data-themed]) .bs-sheet {
        background: #f0f0f5;
      }
      @media (prefers-color-scheme: light) {
        html.follow-scheme #mount .bs-sheet {
          background: #f0f0f5;
        }
      }
      html.animated #mount .bs-sheet {
        transition: background-color 400ms linear;
      }
      body.tall {
        min-height: 300vh;
      }
      #mount[data-frame] {
        position: relative;
        width: 300px;
        height: 520px;
        margin: 120px 0 0 40px;
        overflow: hidden;
        background: #0e1418;
      }
      #mount[data-frame="transform"] {
        transform: translateZ(0);
      }
      #mount[data-frame="contain"] {
        contain: paint;
      }
      #mount[data-frame] .bs-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #mount[data-frame] .bs-sheet {
        position: absolute !important;
      }
      .sheet-body {
        padding: 16px;
      }
      .sheet-card {
        margin: 0 16px 12px;
        padding: 14px 16px;
        background: #33333d;
        border: 1px solid #4a4a57;
        border-radius: 12px;
      }
      .rich-label {
        margin: 0 16px 6px;
        font: 600 11px/1.6 ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9a9aa8;
      }
      .rich-text {
        margin: 0 16px 12px;
        font: 15px/1.55 Georgia, serif;
        color: #e8e8ea;
      }
      .rich-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 16px 12px;
        color: #ff8a6a;
        font: 14px/1.4 system-ui, sans-serif;
      }
      .rich-row svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .rich-badge {
        margin: 0 16px 12px;
        padding: 8px 12px;
        border-radius: 10px;
        background: linear-gradient(90deg, #3a2a66, #24506b);
        color: #fff;
        font: 13px/1.4 system-ui, sans-serif;
      }
      .rich-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      .sheet-swatch {
        display: block;
        margin: 0 16px 16px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="to-full" type="button">full</button>
      <button id="to-min" type="button">minimized</button>
      <button id="lose-context" type="button">lose context</button>
    </div>
    <div id="status" data-unsupported="">renderer: pending</div>
    <div id="mount"></div>
    <script type="module" src="./webgl.ts"></script>
  </body>
</html>
