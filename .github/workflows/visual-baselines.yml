name: Visual baselines (linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      # `--update-snapshots` defaults to "changed", which only rewrites a
      # baseline when the diff exceeds maxDiffPixelRatio (2%). A stale-but-
      # tolerated baseline therefore survives every regeneration: the hero
      # counters sat frozen mid-count in these files for that reason. "all"
      # rewrites unconditionally.
      - name: Generate linux snapshots
        run: npx playwright test tests/e2e/visual-regression.spec.ts --update-snapshots=all
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/e2e/visual-regression.spec.ts-snapshots/
          retention-days: 14
